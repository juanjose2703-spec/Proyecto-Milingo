<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF6E8">
  <title>Panel · Milingo</title>
  <link rel="icon" type="image/svg+xml" href="/recursos/mascota-feliz.svg">
  <link rel="stylesheet" href="/estilos/base.css">
  <link rel="stylesheet" href="/estilos/componentes.css">
  <link rel="stylesheet" href="/estilos/paginas.css">
  <script src="/scripts/api.js" defer></script>
  <script src="/scripts/progreso.js" defer></script>
</head>
<body>
  <header class="cabecera">
    <div class="contenedor cabecera__interior">
      <a class="logo" href="/panel" aria-label="Milingo, panel">
        <img class="logo__icono" src="/recursos/mascota-feliz.svg" alt="" width="40" height="40">
        <span>Milingo</span>
      </a>
      <button type="button" class="boton boton--secundario boton--chico" id="boton-salir">Salir</button>
    </div>
  </header>

  <main class="contenedor panel-provisional" id="contenido">
    <section class="tarjeta panel-provisional__tarjeta entrada-suave">
      <img class="panel-provisional__mascota" src="/recursos/mascota-feliz.svg" alt="" width="120" height="120">
      <h1 id="saludo">Cargando…</h1>
      <p id="detalle"></p>
      <div class="aviso aviso--info">
        <span>Pantalla provisional: el panel real, con XP, racha y corazones, llega en la siguiente etapa.</span>
      </div>
    </section>
  </main>
</body>
</html>
