<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FFF6E8">
  <title>Iniciar sesión · Milingo</title>
  <link rel="icon" type="image/svg+xml" href="/recursos/mascota-feliz.svg">
  <link rel="stylesheet" href="/estilos/base.css">
  <link rel="stylesheet" href="/estilos/componentes.css">
  <link rel="stylesheet" href="/estilos/paginas.css">
  <script src="/scripts/api.js" defer></script>
  <script src="/scripts/autenticacion.js" defer></script>
</head>
<body>
  <div class="corazones" aria-hidden="true">
    <span class="corazon corazon--1"></span>
    <span class="corazon corazon--2"></span>
    <span class="corazon corazon--3"></span>
  </div>

  <main class="centro" id="contenido">
    <div class="acceso">
      <a class="volver" href="/">← Volver al inicio</a>

      <section class="tarjeta acceso__tarjeta entrada-suave" id="tarjeta-acceso"
               aria-labelledby="titulo-acceso">
        <img class="acceso__mascota" src="/recursos/mascota-feliz.svg" alt="" width="96" height="96">
        <h1 id="titulo-acceso">¡Qué bueno verte!</h1>
        <p class="acceso__subtitulo">Entra para seguir aprendiendo.</p>

        <div id="aviso" class="aviso aviso--error" role="alert" hidden>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          <span id="aviso-texto"></span>
        </div>

        <form id="formulario-acceso" novalidate>
          <div class="campo">
            <label for="usuario">Usuario o correo</label>
            <input class="entrada" id="usuario" name="usuario" type="text"
                   autocomplete="username" autocapitalize="none" spellcheck="false"
                   maxlength="120" required aria-describedby="error-usuario">
            <p class="campo__error" id="error-usuario"></p>
          </div>

          <div class="campo">
            <label for="contrasena">Contraseña</label>
            <div class="campo-clave">
              <input class="entrada" id="contrasena" name="contrasena" type="password"
                     autocomplete="current-password" maxlength="256" required
                     aria-describedby="error-contrasena">
              <button type="button" class="ver-clave" id="ver-clave"
                      aria-label="Mostrar contraseña" aria-pressed="false">
                <svg class="ojo-abierto" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="ojo-cerrado" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.7 9.7 0 0 0 4.4-1"/></svg>
              </button>
            </div>
            <p class="campo__error" id="error-contrasena"></p>
          </div>

          <button class="boton boton--bloque boton--grande" type="submit" id="boton-acceso">
            <span class="giro" aria-hidden="true"></span>
            <span id="boton-acceso-texto">Entrar</span>
          </button>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
